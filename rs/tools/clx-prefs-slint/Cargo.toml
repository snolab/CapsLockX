[package]
name = "clx-prefs-slint"
version = "0.1.0"
edition = "2021"
description = "CapsLockX preferences window — Slint native, cross-platform (fast, no WebView2)"
license = "GPL-3.0"

[[bin]]
name = "clx-prefs-slint"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.8.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
dirs = "5"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "=1.8.0"
