[package]
name = "capslockx-macos"
version = "2.1.0"
edition = "2021"
description = "CapsLockX macOS adapter – CGEventTap hook + CGEventPost output"
license = "GPL-3.0"

[[bin]]
name = "capslockx"
path = "src/main.rs"

[[bin]]
name = "clx-prompt"
path = "src/bin/clx-prompt.rs"

[[bin]]
name = "clx-agent"
path = "src/bin/clx-agent.rs"

[features]
default = []
# Full build: cloud AI (brainstorm/agent). Used by the "setup" release
# variant. The "portable" variant builds without --features full.
# (Voice input moved to otoji — there is no `stt` feature any more.)
full = ["capslockx-core/ai"]

[dependencies]
capslockx-core = { path = "../../core" }
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
libc = "0.2"

[build-dependencies]
cc = "1"

# Core Graphics / Core Foundation are only available on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
foreign-types = "0.5"
