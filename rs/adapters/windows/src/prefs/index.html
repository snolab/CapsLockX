<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>CapsLockX Preferences</title>
  <style>
    /* Catppuccin Mocha palette */
    :root {
      --base:     #1e1e2e;
      --mantle:   #181825;
      --surface0: #313244;
      --overlay1: #7f849c;
      --text:     #cdd6f4;
      --subtext0: #a6adc8;
      --blue:     #89b4fa;
      --green:    #a6e3a1;
      --red:      #f38ba8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--base);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      padding: 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 20px;
      letter-spacing: 0.4px;
    }

    section {
      background: var(--mantle);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--subtext0);
      margin-bottom: 14px;
    }

    /* Checkboxes */
    .cb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }

    .cb-row input[type=checkbox] {
      width: 16px; height: 16px;
      accent-color: var(--blue);
      cursor: pointer;
      flex-shrink: 0;
    }

    .cb-row label { cursor: pointer; }

    /* Sliders */
    .sl-row {
      display: grid;
      grid-template-columns: 130px 1fr 56px;
      align-items: center;
      gap: 14px;
      padding: 7px 0;
    }

    .sl-row label { color: var(--text); }

    .sl-row input[type=range] {
      width: 100%;
      accent-color: var(--blue);
    }

    .sl-row span {
      text-align: right;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    /* Status bar */
    #status {
      font-size: 12px;
      color: var(--overlay1);
      text-align: right;
      margin-top: 8px;
      min-height: 18px;
      transition: color 0.2s;
    }

    #status.saved { color: var(--green); }
    #status.error { color: var(--red); }
  </style>
</head>
<body>
  <h1>CapsLockX Preferences</h1>

  <section>
    <h2>Trigger Keys</h2>
    <div class="cb-row">
      <input type="checkbox" id="use_capslock">
      <label for="use_capslock">CapsLock</label>
    </div>
    <div class="cb-row">
      <input type="checkbox" id="use_space">
      <label for="use_space">Space</label>
    </div>
    <div class="cb-row">
      <input type="checkbox" id="use_insert">
      <label for="use_insert">Insert</label>
    </div>
    <div class="cb-row">
      <input type="checkbox" id="use_scroll_lock">
      <label for="use_scroll_lock">Scroll Lock</label>
    </div>
    <div class="cb-row">
      <input type="checkbox" id="use_ralt">
      <label for="use_ralt">Right Alt</label>
    </div>
  </section>

  <section>
    <h2>Speeds</h2>
    <div class="sl-row">
      <label for="cursor_speed">Cursor Speed</label>
      <input type="range" id="cursor_speed" min="1" max="120" step="1">
      <span id="cursor_speed_val">15</span>
    </div>
    <div class="sl-row">
      <label for="mouse_speed">Mouse Speed</label>
      <input type="range" id="mouse_speed" min="50" max="7000" step="50">
      <span id="mouse_speed_val">360</span>
    </div>
    <div class="sl-row">
      <label for="scroll_speed">Scroll Speed</label>
      <input type="range" id="scroll_speed" min="100" max="1500" step="20">
      <span id="scroll_speed_val">720</span>
    </div>
  </section>

  <section id="bs-section">
    <h2>Local AI · Brainstorm (Space+B)</h2>
    <div id="bs-detect" class="bs-muted">Detecting…</div>
    <div id="bs-hw" class="bs-muted" style="margin-top:6px;"></div>
    <div class="sl-row" style="grid-template-columns: 130px 1fr; margin-top:10px;">
      <label for="bs-model">Model</label>
      <input type="text" id="bs-model" spellcheck="false"
             style="background:var(--surface0); color:var(--text); border:1px solid var(--overlay1);
                    border-radius:6px; padding:6px 8px; font-family:monospace;">
    </div>
    <div style="display:flex; align-items:center; gap:12px; margin-top:12px;">
      <button id="bs-setup-btn"
              style="font-family:inherit; font-size:13px; font-weight:600; padding:8px 18px;
                     border-radius:7px; border:1px solid var(--blue); background:var(--blue);
                     color:var(--base); cursor:pointer;">Set up local AI</button>
      <span id="bs-progress" class="bs-muted" style="flex:1;"></span>
    </div>
    <div class="bs-muted" style="margin-top:10px; font-size:11px;">
      Runs a private AI on your PC via Ollama — no cloud, no API key. We pick a
      model that fits your hardware; you can change it above.
    </div>
  </section>

  <div id="status">Loading…</div>

  <style>
    .bs-muted { font-size: 12px; color: var(--subtext0); }
    #bs-section.highlight { outline: 2px solid var(--blue); }
    #bs-detect.ok { color: var(--green); }
  </style>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const status = document.getElementById('status');
    let debounce = null;
    // Full config snapshot — spread into every save so fields this form doesn't
    // expose (API keys, local_model, prefer_local, …) are preserved, not reset.
    let currentCfg = {};

    function collectForm() {
      return Object.assign({}, currentCfg, {
        use_capslock:    document.getElementById('use_capslock').checked,
        use_space:       document.getElementById('use_space').checked,
        use_insert:      document.getElementById('use_insert').checked,
        use_scroll_lock: document.getElementById('use_scroll_lock').checked,
        use_ralt:        document.getElementById('use_ralt').checked,
        cursor_speed:    parseFloat(document.getElementById('cursor_speed').value),
        mouse_speed:     parseFloat(document.getElementById('mouse_speed').value),
        scroll_speed:    parseFloat(document.getElementById('scroll_speed').value),
      });
    }

    function populateForm(cfg) {
      currentCfg = cfg;
      document.getElementById('use_capslock').checked    = cfg.use_capslock;
      document.getElementById('use_space').checked       = cfg.use_space;
      document.getElementById('use_insert').checked      = cfg.use_insert;
      document.getElementById('use_scroll_lock').checked = cfg.use_scroll_lock;
      document.getElementById('use_ralt').checked        = cfg.use_ralt;
      setSlider('cursor_speed', cfg.cursor_speed);
      setSlider('mouse_speed',  cfg.mouse_speed);
      setSlider('scroll_speed', cfg.scroll_speed);
    }

    function setSlider(id, value) {
      document.getElementById(id).value = value;
      document.getElementById(id + '_val').textContent = value;
    }

    // Live label update while dragging
    ['cursor_speed', 'mouse_speed', 'scroll_speed'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        document.getElementById(id + '_val').textContent = e.target.value;
      });
    });

    function schedulesSave() {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        invoke('set_config', { cfg: collectForm() })
          .then(() => {
            status.textContent = 'Saved \u2713';
            status.className = 'saved';
            setTimeout(() => { status.textContent = ''; status.className = ''; }, 2000);
          })
          .catch(err => {
            status.textContent = 'Error: ' + err;
            status.className = 'error';
          });
      }, 300);
    }

    document.querySelectorAll('input').forEach(el => {
      el.addEventListener('change', schedulesSave);
      el.addEventListener('input',  schedulesSave);
    });

    // Initial load
    invoke('get_config')
      .then(cfg => { populateForm(cfg); status.textContent = ''; })
      .catch(err => { status.textContent = 'Failed to load: ' + err; status.className = 'error'; });

    // ── Local AI (Brainstorm) wizard ──────────────────────────────────────
    const bsDetect = document.getElementById('bs-detect');
    const bsHw     = document.getElementById('bs-hw');
    const bsModel  = document.getElementById('bs-model');
    const bsProg   = document.getElementById('bs-progress');
    const bsBtn    = document.getElementById('bs-setup-btn');

    const STATUS_TEXT = {
      ready:            ['Local AI is ready.', true],
      running_no_model: ['Ollama is running but no model is installed yet.', false],
      down:             ['Ollama is installed but not running — we can start it.', false],
      not_installed:    ['Ollama is not installed yet — we can install it for you.', false],
    };

    function refreshBs() {
      return invoke('bs_detect').then(s => {
        const [txt, ok] = STATUS_TEXT[s.status] || [s.status, false];
        bsDetect.textContent = txt;
        bsDetect.className = ok ? 'bs-muted ok' : 'bs-muted';
        const vram = s.vram_gb > 0 ? `, ${s.vram_gb} GB VRAM` : '';
        bsHw.textContent = `Detected: ${s.ram_gb} GB RAM${vram}, ${s.cpu_cores} cores · recommended ${s.recommended}`;
        if (!bsModel.value) bsModel.value = s.current_model;
        bsBtn.textContent = s.status === 'ready' ? 'Re-run setup' : 'Set up local AI';
      }).catch(e => { bsDetect.textContent = 'Detection failed: ' + e; });
    }

    bsBtn.addEventListener('click', () => {
      const model = bsModel.value.trim();
      if (!model) { bsProg.textContent = 'Enter a model name first.'; return; }
      bsBtn.disabled = true;
      bsProg.textContent = 'Starting…';
      invoke('bs_run_setup', { model })
        .then(msg => {
          bsProg.textContent = msg;
          bsBtn.disabled = false;
          refreshBs();
          invoke('get_config').then(cfg => { currentCfg = cfg; });
        })
        .catch(err => { bsProg.textContent = 'Error: ' + err; bsBtn.disabled = false; });
    });

    // Live progress from the Rust setup task.
    window.__TAURI__.event.listen('bs-progress', e => { bsProg.textContent = e.payload; });

    refreshBs();

    // If launched in setup mode (Space+B with no ready local AI), highlight the
    // section and bring it into view.
    invoke('is_setup_mode').then(on => {
      if (on) {
        const sec = document.getElementById('bs-section');
        sec.classList.add('highlight');
        sec.scrollIntoView({ behavior: 'smooth' });
      }
    });

    // Build/version footer — confirms which build is actually running, where it
    // came from, and whether a newer release exists on the official repo.
    invoke('get_version').then(v => {
      let el = document.getElementById('clx-version');
      if (!el) {
        el = document.createElement('div');
        el.id = 'clx-version';
        el.style.cssText = 'margin:18px 0 8px;text-align:center;opacity:.6;font-size:12px;line-height:1.6';
        document.body.appendChild(el);
      }
      el.innerHTML =
        'CapsLockX <b>v' + v.version + '</b> · ' + v.source +
        '<br>built ' + v.built +
        '<br><span id="clx-latest" style="opacity:.8">checking latest…</span>' +
        '<br><span style="opacity:.45;font-size:11px">' + v.exe_path + '</span>';

      // Best-effort latest-release lookup against the official GitHub repo.
      // Fails silently (offline / rate-limited) without breaking the footer.
      fetch('https://api.github.com/repos/' + v.repo + '/releases/latest', {
        headers: { 'Accept': 'application/vnd.github+json' }
      })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(rel => {
          const latest = (rel.tag_name || '').replace(/^v/, '');
          const cur = v.version;
          const ls = document.getElementById('clx-latest');
          if (!latest) { ls.textContent = 'latest: unknown'; return; }
          if (latest === cur) {
            ls.innerHTML = '✓ up to date (latest v' + latest + ')';
            ls.style.color = '#3a3';
          } else {
            ls.innerHTML = '⚠ update available: <b>v' + latest + '</b> · <a href="https://github.com/'
              + v.repo + '/releases/latest" target="_blank">release notes</a>';
            ls.style.color = '#c80';
          }
        })
        .catch(() => {
          const ls = document.getElementById('clx-latest');
          if (ls) ls.textContent = 'latest: offline / unavailable';
        });
    }).catch(() => {});
  </script>
</body>
</html>
