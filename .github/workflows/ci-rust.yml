name: ci-rust

on:
  push:
    branches: [main, beta, prod]
    paths:
      - "rs/**"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    branches: [main, beta, prod]
    paths:
      - "rs/**"
      - ".github/workflows/ci-rust.yml"

# Which platform jobs run is decided by what a push actually changed. Getting that
# comparison right, and making it fail in the safe direction, took two attempts.
#
# `paths-filter` answers "what changed relative to a base", and left to itself on a
# push it takes the base to be the default branch — it logs `Searching for merge-base
# main...beta`. This project pushes `beta` and then fast-forwards `main` to the same
# commit, so by the time the filter ran the two were identical, every filter came out
# `false`, and all three platform jobs skipped. Every push produced a green CI run in
# which nothing had been compiled.
#
# Worse downstream: release-schedule.yml refuses to publish without green CI on the
# exact commit, and a run of skipped jobs reports no failures, so the guard would have
# waved through commits nothing had tested. (That guard now also requires at least one
# job to have actually succeeded — belt as well as braces.)
#
# The base is therefore given explicitly as `github.event.before`: the commit the push
# moved off, so the diff is exactly what the push introduced. On a pull request it is
# left empty, because there the action's own default — the PR's base branch — is the
# right question.
#
# Two ways that can still go wrong, both handled:
#
#   * `before` is forty zeroes when a branch is first pushed, and points at an
#     orphaned commit after a force-push. Either way the diff cannot be computed.
#   * A failed filter step yields empty outputs, and a `needs:`-gated job reading an
#     empty output skips — silently reproducing the exact bug above.
#
# So the step is `continue-on-error` and the job conditions test `!= 'false'` rather
# than `== 'true'`. A job runs unless the filter positively said its paths were
# untouched; anything else — unknown, empty, errored — builds. The filter can only
# ever remove work when it is confident, which is the only safe polarity for the
# thing a release gate depends on.
#
# `fetch-depth: 0` because the base commit has to be present locally to diff against.
jobs:
  # Detect which parts of the rs/ tree changed. Adapter-only PRs skip the
  # other platforms; core / workspace-root changes still fan out to all
  # three platform jobs because each one also tests capslockx-core.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          # On a push, diff against the commit the push moved off. Empty on a pull
          # request so the action uses the PR base, and empty for the forty-zero
          # `before` of a branch's first push, where there is nothing to diff.
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            core:
              - 'rs/core/**'
              - 'rs/Cargo.toml'
              - 'rs/Cargo.lock'
              - 'rs/tools/**'
              - '.github/workflows/ci-rust.yml'
            windows:
              - 'rs/adapters/windows/**'
            linux:
              - 'rs/adapters/linux/**'
            macos:
              - 'rs/adapters/macos/**'

  build-and-test:
    name: Build & Test (windows-latest / x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.core != 'false' || needs.changes.outputs.windows != 'false' }}

    steps:
      - uses: actions/checkout@v4

      # Stable toolchain + clippy.
      # windows-latest ships with the MSVC linker and Windows SDK, so
      # x86_64-pc-windows-msvc is available without any extra setup.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache ~/.cargo/registry, ~/.cargo/git, and rs/target.
      # workspaces: "<manifest-dir> -> <target-dir>" (non-root workspace)
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs -> rs/target

      # Type-check platform-relevant crates (exclude macOS/linux adapters).
      - name: cargo check
        working-directory: rs
        run: cargo check -p capslockx-core -p capslockx-windows --all-targets

      - name: cargo clippy
        working-directory: rs
        # Temporarily relaxed from `-D warnings` while the WIP voice/agent
        # backlog (committed in af7842a as a snapshot) lints clean. Tighten
        # back once those modules get a focused clippy pass.
        run: cargo clippy -p capslockx-core -p capslockx-windows --all-targets

      - name: cargo test
        working-directory: rs
        run: cargo test -p capslockx-core -p capslockx-windows

      # Full release build to catch LTO / codegen-units issues early.
      - name: cargo build --release (windows adapter)
        working-directory: rs
        run: cargo build -p capslockx-windows --release

  build-linux:
    name: Build & Test (ubuntu-latest / x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.core != 'false' || needs.changes.outputs.linux != 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs -> rs/target

      # Check platform-relevant crates (exclude macOS/windows adapters).
      - name: cargo check
        working-directory: rs
        run: cargo check -p capslockx-core -p capslockx-linux --all-targets

      - name: cargo clippy
        working-directory: rs
        run: cargo clippy -p capslockx-core -p capslockx-linux --all-targets

      - name: cargo test
        working-directory: rs
        run: cargo test -p capslockx-core -p capslockx-linux

      # Full release build of the Linux adapter.
      - name: cargo build --release (linux adapter)
        working-directory: rs
        run: cargo build -p capslockx-linux --release

  build-macos:
    name: Build & Test (macos-latest / aarch64-apple-darwin)
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.core != 'false' || needs.changes.outputs.macos != 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs -> rs/target

      # Check platform-relevant crates (exclude windows/linux adapters).
      - name: cargo check
        working-directory: rs
        run: cargo check -p capslockx-core -p capslockx-macos --all-targets

      - name: cargo clippy
        working-directory: rs
        run: cargo clippy -p capslockx-core -p capslockx-macos --all-targets

      - name: cargo test
        working-directory: rs
        run: cargo test -p capslockx-core -p capslockx-macos

      # Full release build of the macOS adapter.
      - name: cargo build --release (macos adapter)
        working-directory: rs
        run: cargo build -p capslockx-macos --release

  coverage:
    name: Coverage report (capslockx-core, lib only)
    runs-on: ubuntu-latest
    needs: [changes, build-linux]
    if: ${{ needs.changes.outputs.core != 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs -> rs/target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage threshold gate. Conservative starting floor — raise as the
      # codebase stabilises. Failing under the threshold blocks the PR.
      # Override via repo variable `COVERAGE_MIN_LINES` if you need to bump
      # without editing this file.
      - name: Generate coverage report (with threshold)
        working-directory: rs
        env:
          COVERAGE_MIN_LINES: ${{ vars.COVERAGE_MIN_LINES || '20' }}
        run: |
          cargo llvm-cov --lib -p capslockx-core \
            --fail-under-lines "$COVERAGE_MIN_LINES" \
            --summary-only | tee coverage.txt

      - name: Generate LCOV report
        if: always()
        working-directory: rs
        run: cargo llvm-cov report --lcov --output-path coverage.lcov

      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            rs/coverage.txt
            rs/coverage.lcov
