# Scheduled releases: beta nightly, prod weekly.
#
# Neither publishes anything itself. Each one bumps the version, commits it and
# pushes a `v*` tag; the existing tag-triggered workflows (npm-publish,
# release-rust, choco-push, package-macos-app) do the shipping. One place decides
# *when* to release, four places decide *how*, and neither has to know about the
# other.
#
# Three guards, because an unattended publish to everyone's `npm i` deserves them:
#
#   1. Nothing new, no release. An empty version bump is noise that costs users a
#      download and tells them nothing.
#   2. CI must be green on the commit being released. Automating releases off an
#      untested branch is automating the shipping of untested code.
#   3. Prod promotes a commit that was actually released as a beta, rather than
#      cutting from an untested tree. A weekly stable release whose code nobody
#      has run is a nightly with extra confidence and no extra evidence.
#
# The prod run also *performs* that promotion — fast-forwarding the `prod` branch
# to the newest released beta tag — because nothing else in the repository moves
# that branch.
#
# Manual runs are allowed (`workflow_dispatch`) so a release can be cut on demand
# without waiting for the clock, and `dry_run` shows what would happen.
#
# REQUIRES a `RELEASE_TOKEN` secret (a PAT with `contents: write`). Tags pushed
# with the default `GITHUB_TOKEN` deliberately do NOT trigger other workflows, so
# with it the tag appears and nothing publishes — which looks exactly like a
# broken release. The run fails early and says so rather than leaving that puzzle.

name: release-schedule

on:
  schedule:
    # 03:17 UTC daily — beta. Off the hour, because every project in the world
    # schedules on the hour and GitHub's runners queue accordingly.
    - cron: "17 3 * * *"
    # 09:23 UTC Monday — prod. Early in the week, so a bad stable release is
    # found on a working day rather than discovered on a Saturday.
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to release"
        type: choice
        options: [beta, prod]
        default: beta
      dry_run:
        description: "Work out the version and stop, without tagging"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'snolab/CapsLockX'
    runs-on: ubuntu-latest
    steps:
      - name: Decide the channel
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
            dry="${{ inputs.dry_run }}"
          elif [ "${{ github.event.schedule }}" = "23 9 * * 1" ]; then
            channel=prod
            dry=false
          else
            channel=beta
            dry=false
          fi
          branch=$channel
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "branch=$branch"   >> "$GITHUB_OUTPUT"
          echo "dry=$dry"         >> "$GITHUB_OUTPUT"
          echo "releasing $channel from $branch (dry_run=$dry)"

      # A scheduled run skips; a run someone asked for fails. Before the token is
      # set up, nightly failures would just be noise arriving at 03:17 every day,
      # whereas a manual run is a question that deserves a straight answer.
      - name: Need a push token
        id: token
        if: steps.what.outputs.dry != 'true'
        run: |
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TOKEN is not set: a tag pushed with GITHUB_TOKEN does not"
          echo "trigger the publish workflows, so the release would ship nothing."
          echo "Add it with: gh secret set RELEASE_TOKEN --repo ${{ github.repository }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            exit 1
          fi
          echo "::warning::skipping the scheduled release until RELEASE_TOKEN exists"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Promotion, prod only — and the step without which the prod channel does not
      # work at all. Nothing else moves the `prod` branch: not this workflow, not
      # CI, not a merge. Left out, the weekly run cuts one release from wherever a
      # human last left `prod` and then reports "nothing new since" every Monday
      # for ever, which looks like a healthy schedule and ships nothing.
      #
      # What gets promoted is the newest *released beta tag*, not beta's tip. That
      # is the only honest reading of "promote what beta has been running": beta's
      # tip may be minutes old and have reached nobody, whereas a `v*-beta.*` tag
      # was published to the beta dist-tag and has had at least a night to go
      # wrong. It also replaces the old guard 3, which asked whether HEAD was an
      # ancestor of `origin/beta` — true of any unreleased beta commit, so it
      # admitted exactly the untested trees it was meant to keep out.
      #
      # Fast-forward only. A `prod` carrying commits of its own means someone
      # hotfixed the branch directly, and quietly discarding that is the one
      # outcome nobody wants; say so and stop instead.
      - name: Promote the newest released beta
        id: promote
        if: steps.what.outputs.channel == 'prod'
        run: |
          # checkout@v4 fetched this branch and its tags; `beta` is a different ref
          # and has to be asked for by name.
          git fetch --tags --force origin '+refs/heads/beta:refs/remotes/origin/beta'
          tag="$(git tag --list 'v*-beta.*' --sort=-v:refname --merged origin/beta | head -1)"
          if [ -z "$tag" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no v*-beta.* tag on beta yet — nothing has been through"
            echo "the beta channel, so there is nothing to promote to prod"
            exit 0
          fi
          # Three relations between `prod` and that tag, and they are not symmetric:
          #
          #   tag is ahead of prod   the normal case — fast-forward and release
          #   tag is behind prod     prod already contains it. True right now, since
          #                          the newest beta tag predates the last stable
          #                          release: promoting would move prod *backwards*.
          #                          Stand down; the next nightly beta tags a commit
          #                          that is ahead, and Monday proceeds on its own.
          #   diverged               only reachable by committing to `prod` directly.
          #                          Discarding that quietly is the one unacceptable
          #                          outcome, so this is the only case that fails.
          target="$(git rev-parse "$tag^{commit}")"
          if [ "$(git rev-parse HEAD)" = "$target" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "prod is already at $tag — nothing new to promote"
          elif git merge-base --is-ancestor "$target" HEAD; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already contained in prod — waiting for a newer beta"
          elif git merge-base --is-ancestor HEAD "$target"; then
            echo "promoting prod: $(git rev-parse --short HEAD) -> $tag"
            git merge --ff-only "$target"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod and $tag have diverged — prod carries commits the beta tag" >&2
            echo "does not contain, so someone committed to the branch directly." >&2
            echo "Promoting would discard them; resolve by hand." >&2
            exit 1
          fi

      # Guard 1: has anything actually changed since the last release on this
      # channel? `git describe` finds the most recent matching tag reachable from
      # here, so this compares against what this channel last shipped.
      #
      # Skipped when promotion found nothing: every later step keys off `go`, which
      # is unset when this does not run, so the whole release stands down.
      - name: Anything to release?
        id: changed
        if: steps.promote.outputs.ok != 'false'
        run: |
          channel="${{ steps.what.outputs.channel }}"
          if [ "$channel" = "prod" ]; then
            pattern='v[0-9]*.[0-9]*.[0-9]*'
          else
            pattern='v*-beta.*'
          fi
          last="$(git describe --tags --abbrev=0 --match "$pattern" 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "no previous $channel tag — releasing the first one"
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --oneline "$last"..HEAD)" ]; then
            echo "$(git log --oneline "$last"..HEAD | wc -l) commit(s) since $last"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing new since $last — skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"

      # Guard 2: is CI green on exactly this commit? A red or missing run means we
      # do not know, and "we do not know" is not a reason to publish.
      - name: Require green CI on this commit
        if: steps.changed.outputs.go == 'true' && steps.what.outputs.dry != 'true' && steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          state="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
            --jq '[.check_runs[] | select(.name | test("ci-rust|test"; "i")) | .conclusion] | unique')"
          echo "check conclusions: $state"
          if [ "$state" = "[]" ]; then
            echo "no CI run found for $sha — refusing to release blind" >&2
            exit 1
          fi
          if echo "$state" | grep -qE 'failure|cancelled|timed_out'; then
            echo "CI is not green for $sha — refusing to release" >&2
            exit 1
          fi
          # A run whose jobs all *skipped* has no failures either, and this step
          # used to accept it. That was not hypothetical: a path filter comparing
          # beta against an identical main marked every platform job skipped, so
          # each push produced a CI run in which nothing was compiled and nothing
          # failed. Absence of failure is not evidence of success, so require some.
          if ! echo "$state" | grep -q 'success'; then
            echo "no CI job actually succeeded for $sha — every run was skipped or" >&2
            echo "inconclusive, so nothing has tested this commit. Refusing." >&2
            exit 1
          fi

      # Left to npm's semver rather than hand-rolled, because the hand-rolled
      # version was wrong: from a released 2.1.0 it produced `2.1.0-beta.N`, which
      # semver orders *below* 2.1.0 — a beta that looks older than the release it
      # follows, and npm would have refused it or worse, accepted it.
      #
      #   2.1.0        + beta -> preminor  -> 2.2.0-beta.0   (opens the next line)
      #   2.2.0-beta.4 + beta -> prerelease -> 2.2.0-beta.5
      #   2.2.0-beta.4 + prod -> patch      -> 2.2.0         (drops the suffix)
      #   2.2.0        + prod -> patch      -> 2.2.1
      - name: Work out the next version
        id: next
        if: steps.changed.outputs.go == 'true'
        run: |
          current="$(node -p 'require("./package.json").version')"
          if [ "${{ steps.what.outputs.channel }}" = "prod" ]; then
            verb="patch"
          elif [ "$current" = "${current%%-*}" ]; then
            verb="preminor --preid beta"
          else
            verb="prerelease --preid beta"
          fi
          next="$(npm version $verb --no-git-tag-version --allow-same-version | tail -1)"
          next="${next#v}"
          # A tag already there means a previous run half-finished. Stop rather than
          # force anything: the history is easier to read than to repair.
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "v$next already exists — a previous release may have half-run" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "$current -> $next  (npm version $verb)"

      - name: Stop here (dry run)
        if: steps.what.outputs.dry == 'true'
        run: |
          echo "would release ${{ steps.next.outputs.next }} from ${{ steps.what.outputs.branch }}"
          echo "(previous: ${{ steps.changed.outputs.last }}, go=${{ steps.changed.outputs.go }})"

      # package.json and the Cargo manifests carry the same version, and a release
      # where they disagree is one where `clx --version` lies about what it is.
      - name: Bump, commit and tag
        if: steps.changed.outputs.go == 'true' && steps.what.outputs.dry != 'true' && steps.token.outputs.ok == 'true'
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git config user.name "capslockx-release"
          git config user.email "noreply@github.com"
          # package.json already carries $NEXT: the version step wrote it while
          # working the number out. Setting it again is harmless and makes this step
          # correct on its own if the two are ever reordered.
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          for manifest in rs/core/Cargo.toml rs/adapters/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            # Only the package's own version line, which is the first one.
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$NEXT"'"/m' "$manifest"
          done
          # Cargo.lock records workspace member versions too, so without this the
          # tag ships manifests saying $NEXT and a lock still saying the old one —
          # which any `--locked` build rejects. `--workspace` touches only our own
          # packages, never dependency versions.
          cargo update --workspace --quiet || echo "could not refresh Cargo.lock"
          git add -A
          git commit -m "chore(release): $NEXT"
          git tag "v$NEXT"
          git push origin "HEAD:${{ steps.what.outputs.branch }}"
          git push origin "v$NEXT"
          echo "tagged v$NEXT — the publish workflows take it from here"
